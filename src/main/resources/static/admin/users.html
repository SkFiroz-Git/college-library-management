<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Library | Users</title>
    <link rel="icon" href="/assets/images/library-illustration.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body data-page="users" data-roles="ADMIN" data-subtitle="Manage every account in the college">

    <main class="content" id="pageContent">

        <div class="page-head">
            <div>
                <h2>Users</h2>
                <p>Create, edit, activate or remove student, librarian and admin accounts.</p>
            </div>
            <button class="btn btn--primary" id="addUserBtn">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                Add user
            </button>
        </div>

        <section class="card">
            <div class="toolbar">
                <div class="search">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                    <input type="search" id="searchInput" placeholder="Search name, email or college ID…">
                </div>

                <select class="select" id="roleFilter" aria-label="Filter by role">
                    <option value="">All roles</option>
                    <option value="STUDENT">Students</option>
                    <option value="LIBRARIAN">Librarians</option>
                    <option value="ADMIN">Admins</option>
                </select>

                <select class="select" id="statusFilter" aria-label="Filter by status">
                    <option value="">Any status</option>
                    <option value="true">Active</option>
                    <option value="false">Deactivated</option>
                </select>

                <div class="toolbar__spacer"></div>
                <span class="hint" id="resultCount"></span>
            </div>

            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>College ID</th>
                            <th>Role</th>
                            <th>Course / Year</th>
                            <th>Status</th>
                            <th style="text-align:right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userRows">
                        <tr class="loading-row"><td colspan="6">Loading users…</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <span id="pageInfo">—</span>
                <div class="pagination__pages">
                    <button class="btn btn--ghost btn--sm" id="prevPage">Previous</button>
                    <button class="btn btn--ghost btn--sm" id="nextPage">Next</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Create / edit dialog -->
    <dialog class="modal" id="userDialog">
        <form id="userForm" novalidate>
            <div class="modal__head">
                <h3 id="dialogTitle">Add user</h3>
                <button type="button" class="icon-btn" id="closeDialog" aria-label="Close">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="modal__body">
                <input type="hidden" name="id" id="userId">

                <div class="form-grid">
                    <div class="field">
                        <label for="collegeId">College ID <span class="req">*</span></label>
                        <input type="text" id="collegeId" name="collegeId" placeholder="e.g. BCA-2024-105" autocomplete="off">
                        <p class="field__error" hidden></p>
                    </div>

                    <div class="field">
                        <label for="role">Role <span class="req">*</span></label>
                        <select id="role" name="role">
                            <option value="STUDENT">Student</option>
                            <option value="LIBRARIAN">Librarian</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                        <p class="field__error" hidden></p>
                    </div>

                    <div class="field field--full">
                        <label for="name">Full name <span class="req">*</span></label>
                        <input type="text" id="name" name="name" placeholder="e.g. Ananya Sharma" autocomplete="off">
                        <p class="field__error" hidden></p>
                    </div>

                    <div class="field field--full">
                        <label for="email">Email <span class="req">*</span></label>
                        <input type="email" id="email" name="email" placeholder="name@college.edu" autocomplete="off">
                        <p class="field__error" hidden></p>
                    </div>

                    <div class="field field--full">
                        <label for="password" id="passwordLabel">Password <span class="req">*</span></label>
                        <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password">
                        <p class="field__error" hidden></p>
                        <p class="hint" id="passwordHint">Stored as a BCrypt hash — never as plain text.</p>
                    </div>

                    <div class="field">
                        <label for="course">Course</label>
                        <input type="text" id="course" name="course" placeholder="e.g. BCA" autocomplete="off">
                        <p class="field__error" hidden></p>
                    </div>

                    <div class="field">
                        <label for="year">Academic year</label>
                        <input type="number" id="year" name="year" min="1" max="6" placeholder="e.g. 2">
                        <p class="field__error" hidden></p>
                    </div>

                    <div class="field field--full" id="activeField" hidden>
                        <label for="active">Account status</label>
                        <select id="active" name="active">
                            <option value="true">Active — can sign in</option>
                            <option value="false">Deactivated — blocked from signing in</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="modal__foot">
                <button type="button" class="btn btn--ghost" id="cancelDialog">Cancel</button>
                <button type="submit" class="btn btn--primary" id="saveUserBtn">
                    <span>Save user</span>
                    <span class="btn__spinner" aria-hidden="true"></span>
                </button>
            </div>
        </form>
    </dialog>

    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
    <script src="/js/users.js"></script>
</body>
</html>
