<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" role="img" aria-label="College library shelves with books">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="520" height="640" fill="url(#glow)"/>

  <!-- shelves -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round">
    <line x1="60" y1="200" x2="460" y2="200"/>
    <line x1="60" y1="360" x2="460" y2="360"/>
    <line x1="60" y1="520" x2="460" y2="520"/>
  </g>

  <!-- shelf 1 books -->
  <g fill="#ffffff" fill-opacity="0.85">
    <rect x="76" y="118" width="26" height="82" rx="4"/>
    <rect x="110" y="132" width="20" height="68" rx="4" fill-opacity="0.65"/>
    <rect x="138" y="106" width="30" height="94" rx="4" fill-opacity="0.75"/>
    <rect x="176" y="140" width="18" height="60" rx="4" fill-opacity="0.5"/>
    <rect x="202" y="124" width="24" height="76" rx="4"/>
    <rect x="234" y="146" width="16" height="54" rx="4" fill-opacity="0.6"/>
    <rect x="258" y="112" width="28" height="88" rx="4" fill-opacity="0.8"/>
    <rect x="294" y="134" width="20" height="66" rx="4" fill-opacity="0.55"/>
    <rect x="322" y="120" width="26" height="80" rx="4"/>
    <rect x="356" y="144" width="18" height="56" rx="4" fill-opacity="0.65"/>
  </g>

  <!-- leaning book + ladder accent on shelf 1 -->
  <g fill="#ffffff" fill-opacity="0.9">
    <rect x="392" y="128" width="22" height="72" rx="4" transform="rotate(-9 403 164)"/>
    <rect x="424" y="150" width="18" height="50" rx="4" transform="rotate(-9 433 175)"/>
  </g>

  <!-- shelf 2 books -->
  <g fill="#ffffff" fill-opacity="0.8">
    <rect x="80" y="278" width="24" height="82" rx="4"/>
    <rect x="112" y="296" width="18" height="64" rx="4" fill-opacity="0.55"/>
    <rect x="138" y="266" width="30" height="94" rx="4" fill-opacity="0.7"/>
    <rect x="176" y="300" width="20" height="60" rx="4" fill-opacity="0.5"/>
    <rect x="204" y="284" width="26" height="76" rx="4"/>
    <rect x="240" y="306" width="16" height="54" rx="4" fill-opacity="0.6"/>
    <rect x="264" y="272" width="28" height="88" rx="4" fill-opacity="0.75"/>
    <rect x="300" y="292" width="22" height="68" rx="4" fill-opacity="0.6"/>
    <rect x="330" y="264" width="26" height="96" rx="4"/>
    <rect x="366" y="302" width="18" height="58" rx="4" fill-opacity="0.55"/>
    <rect x="394" y="286" width="24" height="74" rx="4" fill-opacity="0.7"/>
    <rect x="426" y="308" width="16" height="52" rx="4" fill-opacity="0.5"/>
  </g>

  <!-- shelf 3 books -->
  <g fill="#ffffff" fill-opacity="0.75">
    <rect x="82" y="438" width="28" height="82" rx="4"/>
    <rect x="118" y="456" width="18" height="64" rx="4" fill-opacity="0.55"/>
    <rect x="144" y="426" width="26" height="94" rx="4" fill-opacity="0.7"/>
    <rect x="178" y="460" width="20" height="60" rx="4" fill-opacity="0.5"/>
    <rect x="206" y="444" width="24" height="76" rx="4"/>
    <rect x="238" y="466" width="16" height="54" rx="4" fill-opacity="0.6"/>
    <rect x="262" y="432" width="30" height="88" rx="4" fill-opacity="0.75"/>
    <rect x="300" y="452" width="20" height="68" rx="4" fill-opacity="0.6"/>
    <rect x="328" y="424" width="26" height="96" rx="4"/>
    <rect x="362" y="464" width="18" height="56" rx="4" fill-opacity="0.55"/>
    <rect x="390" y="446" width="24" height="74" rx="4" fill-opacity="0.7"/>
    <rect x="422" y="468" width="16" height="52" rx="4" fill-opacity="0.5"/>
  </g>

  <!-- open book at the bottom -->
  <g stroke="#ffffff" stroke-opacity="0.8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <path d="M160 574c30-16 66-16 100 0 34-16 70-16 100 0"/>
    <path d="M160 574v34c30-16 66-16 100 0 34-16 70-16 100 0v-34"/>
    <path d="M260 574v34"/>
  </g>

  <!-- reading lamp glow -->
  <path d="M436 40h60l24 78H412z" fill="url(#lamp)" opacity="0.5"/>
</svg>
