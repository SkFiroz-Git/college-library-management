spring.application.name=college-library

# =========================================================
# LOCAL SECRETS (not committed to Git)
# Real DB credentials live in application-local.properties,
# which is listed in .gitignore. Copy the example file:
#   application-local.properties.example -> application-local.properties
# In production set environment variables instead:
#   DB_URL / DB_USERNAME / DB_PASSWORD  (env vars always win)
# Never commit production secrets to Git.
# =========================================================
spring.config.import=optional:file:./application-local.properties

# =========================================================
# DATABASE (MySQL)
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/college_library?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:college_library_app}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
# update = create or alter tables from the Java entities (safe for development).
# In production switch to "validate" and manage schema with migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Show friendly error details only in development
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================================
# SEED ACCOUNT
# A first ADMIN is created automatically on startup when no
# admin exists yet. Remove this block in production and create
# admins only from an existing admin account.
# =========================================================
app.seed.admin-college-id=${SEED_ADMIN_ID:ADMIN-001}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@college.edu}
app.seed.admin-name=${SEED_ADMIN_NAME:College Administrator}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@123}
# Loads the sample books + students the first time the database is empty.
# Set to false in production: SEED_DEMO_DATA=false
app.seed.demo-data=${SEED_DEMO_DATA:true}
